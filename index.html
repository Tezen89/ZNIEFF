<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JEP Chevannes 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/images/logo2.png">
<link rel="apple-touch-icon" href="assets/images/logo2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JEP Chevannes">
<meta name="theme-color" content="#1A3A5C">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A3A5C;--blue2:#2A5A8C;--blue3:#4A8FBF;--blue4:#E8F2FA;
  --gold:#C8973A;--grl:#F4F6F8;--gr2:#9BA5B0;--gr3:#4A5568;
  --ink:#1A202C;--r:12px;--hh:88px;--fh:64px;
  --logo-h:60px;--logo2-h:60px;
}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;background:var(--grl);color:var(--ink);}
.vue{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;padding-bottom:var(--fh);}
.vue.active{display:flex;}

/* ── HEADER ── */
.hdr{height:var(--hh);background:var(--blue);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.2rem;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:10;}
.hdr-logo{height:var(--logo-h);width:auto;object-fit:contain;flex-shrink:0;}
.hdr-logo2{height:var(--logo2-h);width:auto;object-fit:contain;flex-shrink:0;}

/* ── FOOTER NAV GLOBAL (position fixe en bas) ── */
.fnav{position:fixed;bottom:0;left:0;right:0;height:var(--fh);
  background:#fff;border-top:1px solid #E2E8F0;
  display:flex;align-items:stretch;z-index:100;}
.ftab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;border:none;background:none;font-family:inherit;
  padding:0;transition:background .15s;position:relative;}
.ftab:hover{background:var(--blue4);}
.ftab.on{color:var(--blue);}
.ftab.on::after{content:'';position:absolute;top:0;left:15%;right:15%;
  height:2.5px;background:var(--blue);border-radius:0 0 3px 3px;}
.ftab-i{width:24px;height:24px;object-fit:contain;}
.ftab-i.em{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;}
.ftab-lbl{font-size:9px;font-weight:500;color:var(--gr2);letter-spacing:.02em;}
.ftab.on .ftab-lbl{color:var(--blue);}

/* ── ACCUEIL ── */
#va{background:linear-gradient(150deg,var(--blue),var(--blue2) 60%,var(--blue3));}
.va-body{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;gap:1.5rem;text-align:center;}
.va-logo1{width:100%;max-width:480px;height:auto;object-fit:contain;display:block;}
.va-titre{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:700;color:#fff;line-height:1.2;width:100%;max-width:480px;}
.va-sous{font-size:clamp(1rem,3vw,1.3rem);font-weight:400;color:rgba(255,255,255,.8);width:100%;max-width:480px;}
.va-logo2{height:60px;width:auto;object-fit:contain;display:block;}

/* ── INTRODUCTION ── */
#vi2{background:var(--grl);}
.vi2-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:1.5rem;max-width:680px;margin:0 auto;width:100%;}
.vi2-tx{font-size:15px;line-height:1.8;color:var(--gr3);text-align:left;}
.vi2-tx b,.vi2-tx strong{font-weight:700;color:var(--ink);}
.vi2-tx h2{font-size:17px;font-weight:700;color:var(--blue);margin:1.2rem 0 .5rem;}
.vi2-tx h3{font-size:15px;font-weight:600;color:var(--blue);margin:1rem 0 .4rem;}
.vi2-tx ul,.vi2-tx ol{padding-left:1.4rem;margin:.5rem 0;}
.vi2-tx li{margin-bottom:.35rem;}
.vi2-tx p{margin-bottom:.75rem;}

/* ── PARCOURS ── */
#vp{position:relative;}
#map{width:100%;}
.notif{position:absolute;top:calc(var(--hh)+10px);left:1rem;right:1rem;z-index:30;
  background:var(--blue);color:#fff;border-radius:var(--r);
  padding:.9rem 1rem;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
  transform:translateY(-20px);opacity:0;transition:all .35s;pointer-events:none;}
.notif.on{transform:none;opacity:1;pointer-events:auto;}
.nbtn{background:var(--gold);color:var(--ink);border:none;
  padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.mst{position:absolute;bottom:calc(var(--fh)+10px);left:50%;transform:translateX(-50%);
  background:rgba(26,58,92,.85);color:#fff;font-size:12px;
  padding:5px 14px;border-radius:20px;z-index:20;pointer-events:none;white-space:nowrap;}

/* ── INVENTAIRE ── */
#vl{overflow:hidden;}
.ltb{padding:.75rem 1rem;background:#fff;border-bottom:1px solid #E2E8F0;flex-shrink:0;display:flex;flex-direction:column;gap:.6rem;}
.ltb input{width:100%;padding:9px 14px;border:1.5px solid #CBD5E0;border-radius:8px;font-size:14px;outline:none;background:var(--grl);}
.ltb input:focus{border-color:var(--blue3);background:#fff;}
.lfil{display:flex;flex-direction:column;gap:.4rem;}
.lfil-group{display:flex;gap:.4rem;flex-wrap:wrap;}
.fb{padding:5px 12px;border-radius:20px;border:1.5px solid #CBD5E0;background:#fff;font-size:12px;cursor:pointer;color:var(--gr3);}
.fb.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
.lsc{flex:1;overflow-y:auto;padding:.75rem;}
.lct{font-size:12px;color:var(--gr2);padding:.3rem .25rem .6rem;}
.lc{background:#fff;border-radius:var(--r);margin-bottom:.75rem;
  display:flex;align-items:stretch;overflow:hidden;cursor:pointer;
  transition:all .2s;border:1.5px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.lc:hover{border-color:var(--blue3);transform:translateY(-1px);}
.lcn{width:52px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
.lcb{flex:1;padding:.85rem 1rem;min-width:0;}
.lct2{font-size:15px;font-weight:600;color:var(--ink);}
.eb.impl{background:#EDE5D0;color:#5C4730;}
.eb{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;
  background:var(--blue4);color:var(--blue);margin-left:6px;}
.eb.ov{background:#E6F4EA;color:#2E7D32;}
.eb.fm{background:#FDECEA;color:#C62828;}
.eb.tv{background:#FFF8E1;color:#F57F17;}
.eb.di{background:#FFE0E0;color:#C62828;}

/* ── FICHE ── */
#vf{overflow:hidden;}
.fsc{flex:1;overflow-y:auto;}
.fb2{padding:1.4rem;max-width:680px;margin:0 auto;width:100%;}
.fiche-intro{margin-bottom:0;}
.fiche-h1{font-size:clamp(1.4rem,5vw,2rem);font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:.5rem;}
.fiche-h2{font-size:clamp(1rem,3vw,1.2rem);font-weight:400;color:var(--gr3);margin-bottom:.3rem;}
.fiche-sep{height:1.8rem;}
.fs{margin-bottom:1.2rem;}
.fsl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gr2);margin-bottom:.75rem;display:flex;align-items:center;gap:8px;}
.fsl::after{content:'';flex:1;height:1px;background:#E2E8F0;}
.fd{font-size:15px;line-height:1.8;color:var(--gr3);}
.fd b,.fd strong{font-weight:700;color:var(--ink);}
.fd h2{font-size:17px;color:var(--blue);margin:.8rem 0 .3rem;}
.fd ul,.fd ol{padding-left:1.4rem;margin:.4rem 0;}
.fd li{margin-bottom:.3rem;}
.fd p{margin-bottom:.6rem;}
.fsrc{font-size:13px;line-height:1.75;color:var(--gr2);font-style:italic;
  padding:.6rem .8rem;background:#fff;border-radius:8px;border:1px solid #E2E8F0;}
/* Photo responsive cliquable */
.fp-wrap{border-radius:10px;overflow:hidden;cursor:zoom-in;}
.fp{width:100%;height:auto;display:block;transition:opacity .2s;}
.fp:hover{opacity:.9;}
/* Modal plein écran */
.photo-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
  z-index:200;align-items:center;justify-content:center;overflow:hidden;}
.photo-modal.open{display:flex;}
.photo-modal img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px;
  touch-action:none;user-select:none;transform-origin:center center;
  transition:transform .05s linear;}
.photo-modal-close{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.2);
  border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;
  cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;}
.photo-modal-hint{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:5px 14px;
  border-radius:20px;pointer-events:none;opacity:1;transition:opacity 1s;white-space:nowrap;}
.doc-modal{display:none;position:fixed;inset:0;z-index:200;flex-direction:column;background:#fff;}
.doc-modal.open{display:flex;}
.doc-modal-hdr{height:52px;background:var(--blue);color:#fff;display:flex;
  align-items:center;justify-content:space-between;padding:0 1rem;flex-shrink:0;}
.doc-modal-hdr span{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-modal-hdr button{background:rgba(255,255,255,.15);border:none;color:#fff;
  padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;flex-shrink:0;margin-left:.5rem;}
.doc-modal iframe{flex:1;border:none;width:100%;}
.fmc{height:220px;border-radius:10px;overflow:hidden;border:1px solid #E2E8F0;}
.tab-btns{display:flex;gap:.5rem;margin-bottom:.75rem;}
.tab-btn{flex:1;padding:10px;border:1.5px solid #CBD5E0;border-radius:8px;
  background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--gr3);
  font-family:inherit;transition:all .2s;}
.tab-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.vw-wrap{position:relative;border-radius:10px;overflow:hidden;background:var(--grl);
  cursor:zoom-in;display:flex;align-items:center;justify-content:center;}
.vw-img{width:100%;height:auto;max-height:65vh;object-fit:contain;display:block;}
.vw-hint{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.5);
  color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;pointer-events:none;}

/* ── CREDITS ── */
#vc{overflow-y:auto;}
.crb{flex:1;overflow-y:auto;padding:1.5rem;max-width:600px;margin:0 auto;width:100%;}
.crs{background:#fff;border-radius:var(--r);padding:1.5rem;margin-bottom:1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.crs h2{font-size:16px;color:var(--blue);margin-bottom:.8rem;}
.crs p,.crs li{font-size:14px;line-height:1.75;color:var(--gr3);}
.crs ul{padding-left:1.2rem;}
.cr-html{font-size:14px;line-height:1.75;color:var(--gr3);}
.cr-html b,.cr-html strong{font-weight:700;color:var(--ink);}
.cr-html h2{font-size:16px;color:var(--blue);margin:.8rem 0 .4rem;}
.cr-html ul,.cr-html ol{padding-left:1.4rem;margin:.4rem 0;}
.cr-html li{margin-bottom:.3rem;}
.cr-html p{margin-bottom:.6rem;}

.udot{width:14px;height:14px;border-radius:50%;background:#4A90E2;border:3px solid #fff;box-shadow:0 0 0 3px rgba(74,144,226,.25);}

/* ── NOTIFICATION GPS GLOBALE ── */
.gps-notif{
  position:fixed;top:-120px;left:1rem;right:1rem;z-index:300;
  transition:top .4s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.25));
}
.gps-notif.show{top:calc(var(--hh) + .75rem);}
.gps-notif-inner{
  background:var(--blue);color:#fff;border-radius:var(--r);
  padding:.9rem 1rem;display:flex;align-items:center;gap:10px;
}
.gps-notif-icon{font-size:22px;flex-shrink:0;}
.gps-notif-text{flex:1;min-width:0;}
.gps-notif-titre{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gps-notif-dist{font-size:11px;opacity:.7;margin-top:2px;}
.gps-notif-btn{background:var(--gold);color:var(--ink);border:none;
  padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;}
.gps-notif-close{background:rgba(255,255,255,.15);border:none;color:#fff;
  width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;}
@media(max-width:400px){.hdr{padding:0 .7rem;}.ftab-lbl{font-size:8px;}.fb2{padding:.9rem;}}
</style>
</head>
<body>

<!-- ══ ACCUEIL ══ -->
<div class="vue active" id="va">
  <div class="va-body">
    <img class="va-logo1" src="assets/images/logo.png" alt="Logo" onerror="this.style.display='none'">
    <h1 class="va-titre" id="vaT">Journées Européennes du Patrimoine</h1>
    <h3 class="va-sous" id="vaS"></h3>
    <img class="va-logo2" src="assets/images/logo2.png" alt="Logo2" onerror="this.style.display='none'">
  </div>
</div>

<!-- ══ INTRODUCTION ══ -->
<div class="vue" id="vi2">
  <div class="hdr">
    <img class="hdr-logo" src="assets/images/logo.png" alt="" onerror="this.style.display='none'">
    <img class="hdr-logo2" src="assets/images/logo2.png" alt="" onerror="this.style.display='none'">
  </div>
  <div class="vi2-body">
    <div class="vi2-tx" id="vi2Tx"></div>
  </div>
</div>

<!-- ══ PARCOURS ══ -->
<div class="vue" id="vp">
  <div class="hdr">
    <img class="hdr-logo" src="assets/images/logo.png" alt="" onerror="this.style.display='none'">
    <img class="hdr-logo2" src="assets/images/logo2.png" alt="" onerror="this.style.display='none'">
  </div>
  <div id="map"></div></div>
  <div class="notif" id="notif">
    <span style="font-size:22px">📍</span>
    <div style="flex:1"><div style="font-size:13px;font-weight:600" id="nT"></div><div style="font-size:11px;opacity:.6" id="nS"></div></div>
    <button class="nbtn" id="nBtn">Voir →</button>
  </div>
  <div class="mst" id="mst">GPS off</div>
</div>

<!-- ══ INVENTAIRE ══ -->
<div class="vue" id="vl">
  <div class="hdr">
    <img class="hdr-logo" src="assets/images/logo.png" alt="" onerror="this.style.display='none'">
    <img class="hdr-logo2" src="assets/images/logo2.png" alt="" onerror="this.style.display='none'">
  </div>
  <div class="ltb">
    <input type="search" id="lsQ" placeholder="🔍  Rechercher…" oninput="renderL()">
    <div class="lfil" id="lfil"></div>
  </div>
  <div class="lsc"><div class="lct" id="lct"></div><div id="litems"></div></div>
</div>

<!-- ══ FICHE ══ -->
<div class="vue" id="vf">
  <div class="hdr">
    <img class="hdr-logo" src="assets/images/logo.png" alt="" onerror="this.style.display='none'">
    <img class="hdr-logo2" src="assets/images/logo2.png" alt="" onerror="this.style.display='none'">
  </div>
  <div class="fsc">
    <div class="fb2">
      <!-- Titre / État / Implantation -->
      <div class="fiche-intro">
        <h1 class="fiche-h1" id="fht"></h1>
        <h2 class="fiche-h2" id="fhe" style="display:none"></h2>
        <h2 class="fiche-h2" id="fhim" style="display:none"></h2>
      </div>
      <!-- Description -->
      <div class="fiche-sep"></div>
      <div class="fs" id="fsdd"><div class="fd" id="fdd"></div></div>
      <!-- Viewer avant/après -->
      <div class="fiche-sep" id="fssep2" style="display:none"></div>
      <div class="fs" id="fssl" style="display:none">
        <div class="fsl">Documents</div>
        <div class="tab-btns">
          <button class="tab-btn on" id="tabBtnAvant" onclick="showTab('avant')"></button>
          <button class="tab-btn" id="tabBtnApres" onclick="showTab('apres')"></button>
        </div>
        <!-- Photo avant (premier par défaut) -->
        <div id="viewAvant">
          <div class="vw-wrap" id="vwAvant" onclick="agrandir('avant')">
            <img class="vw-img" id="vwImgAvant" src="" alt="">
            <div class="vw-hint">Cliquer pour agrandir</div>
          </div>
        </div>
        <!-- Photo après -->
        <div id="viewApres" style="display:none">
          <div class="vw-wrap" id="vwApres" onclick="agrandir('apres')">
            <img class="vw-img" id="vwImgApres" src="" alt="">
            <div class="vw-hint">Cliquer pour agrandir</div>
          </div>
        </div>
      </div>
      <!-- Mini-carte -->
      <div class="fs" id="fsca" style="display:none">
        <div class="fsl">Localisation</div>
        <div class="fmc" id="fmap"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ CREDITS ══ -->
<div class="vue" id="vc">
  <div class="hdr">
    <img class="hdr-logo" src="assets/images/logo.png" alt="" onerror="this.style.display='none'">
    <img class="hdr-logo2" src="assets/images/logo2.png" alt="" onerror="this.style.display='none'">
  </div>
  <div class="crb">
    <div class="crs">
      <div id="crTx" class="cr-html"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
if(location.protocol==='file:'){
  document.body.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:1.5rem;padding:2rem;text-align:center;font-family:sans-serif;background:#1A3A5C;color:#fff"><div style="font-size:48px">⚠️</div><h2>Serveur requis</h2><p style="opacity:.8;max-width:400px;line-height:1.6">Ouvrez un terminal dans ce dossier et lancez :</p><code style="background:rgba(255,255,255,.15);padding:10px 20px;border-radius:8px;font-size:15px">python -m http.server 8000</code><p style="opacity:.8">Puis ouvrez <strong>http://localhost:8000</strong> dans Chrome</p></div>';
  throw new Error('file://');
}

let D=null,C={},MAP=null,mapOk=false,minimaps={},prev='vl',notifTm=null,lastN=null,filtreEtat='tous',filtreImpl='tous';

// ── FOOTER ─────────────────────────────────────
const TABS = [
  {id:'va',  lbl:'Accueil',      cfg:'accueil.png',    em:'🏠'},
  {id:'vi2', lbl:'Introduction', cfg:'intro.png',      em:'📖'},
  {id:'vp',  lbl:'Parcours',     cfg:'parcours.png',   em:'🗺️'},
  {id:'vl',  lbl:'Inventaire',   cfg:'inventaire.png', em:'📋'},
  {id:'vc',  lbl:'Crédits',      cfg:'credits.png',    em:'ℹ️'},
];

function buildFooters(imgs) {
  const el = document.getElementById('fnav-global');
  if (!el) return;
  el.innerHTML = TABS.map(t => {
    const src = imgs[t.cfg];
    const icon = src
      ? `<img class="ftab-i" src="${src}" alt="" onerror="this.outerHTML='<span class=\\'ftab-i em\\'>${t.em}</span>'">`
      : `<span class="ftab-i em">${t.em}</span>`;
    return `<button class="ftab" data-vue="${t.id}" onclick="goV('${t.id}')">${icon}<span class="ftab-lbl">${t.lbl}</span></button>`;
  }).join('');
}

function updateFooterActive(activeVue) {
  document.querySelectorAll('#fnav-global .ftab').forEach(btn =>
    btn.classList.toggle('on', btn.dataset.vue === activeVue));
}

// ── NAVIGATION ─────────────────────────────────
function goV(id) {
  document.querySelectorAll('.vue').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updateFooterActive(id);
  if (id === 'vl') renderL();
  if (id === 'vp') initMap();
}
function back() { goV(prev); }
function openF(l, from) { prev = from || 'vl'; renderF(l); goV('vf'); }

// ── INIT ───────────────────────────────────────
async function init() {
  try {
    const [rd, rc] = await Promise.all([fetch('data.json'), fetch('config.json').catch(() => null)]);
    if (!rd.ok) throw new Error('data.json introuvable');
    D = await rd.json();
    C = rc && rc.ok ? await rc.json() : {};

    if (C.couleurs) Object.entries(C.couleurs).forEach(([k,v]) => document.documentElement.style.setProperty(k,v));
    if (C.dimensions) {
      if (C.dimensions['logo.png'])  document.documentElement.style.setProperty('--logo-h',  C.dimensions['logo.png']);
      if (C.dimensions['logo2.png']) document.documentElement.style.setProperty('--logo2-h', C.dimensions['logo2.png']);
    }

    const imgs = C.images || {};

    // Textes fixes
    document.getElementById('vaT').textContent  = D.sentier.nom;
    document.getElementById('vaS').textContent  = D.sentier.sous_titre;
    // Texte crédits
    document.getElementById('crTx').innerHTML = D.sentier.texte_credits || '';

    // Texte introduction (depuis texte_accueil)
    const tx = D.sentier.texte_accueil || '';
    const txEl = document.getElementById('vi2Tx');
    if (tx) txEl.innerHTML = tx;
    else txEl.innerHTML = '<p style="color:var(--gr2);font-style:italic">Aucun texte d\'introduction défini.<br>Renseignez la variable <code>texte_accueil</code> dans l\'onglet Sentier de l\'Excel.</p>';

    // Filtres inventaire — État
    const etats = ['tous', ...new Set(D.lieux.map(l => l.etat).filter(Boolean).sort())];
    // Filtres inventaire — Implantation
    const impls = ['tous', ...new Set(D.lieux.map(l => l.implantation).filter(Boolean).sort())];

    document.getElementById('lfil').innerHTML =
      '<div class="lfil-group">' +
      etats.map(e => `<button class="fb${e==='tous'?' on':''}" data-type="etat" data-val="${e}" onclick="setF('etat','${e}')">${e==='tous'?'Tous':e}</button>`).join('') +
      '</div>' +
      (impls.length > 1 ?
      '<div class="lfil-group">' +
      impls.map(e => `<button class="fb${e==='tous'?' on':''}" data-type="impl" data-val="${e}" onclick="setF('impl','${e}')">${e==='tous'?'Tous':e}</button>`).join('') +
      '</div>' : '');

    // Footers
    buildFooters(imgs);
    updateFooterActive('va');

    // Démarrer le GPS dès le chargement (fonctionne sur toutes les vues)
    gps();

  } catch(e) { console.error(e); alert('Erreur : ' + e.message); }
}

// ── INVENTAIRE ─────────────────────────────────
function setF(type, val) {
  if (type==='etat') filtreEtat = val;
  else filtreImpl = val;
  document.querySelectorAll('.fb[data-type="'+type+'"]').forEach(b =>
    b.classList.toggle('on', b.dataset.val === val));
  renderL();
}
function eb(e) {
  if (!e) return '';
  const low=e.toLowerCase();
  const c=low.includes('ouvert')?'ov':low.includes('ferm')?'fm':low.includes('travaux')?'tv':low.includes('disparu')?'di':'';
  return `<span class="eb ${c}">${e}</span>`;
}
function renderL() {
  if (!D) return;
  const q=(document.getElementById('lsQ').value||'').toLowerCase();
  let lx=[...D.lieux].sort((a,b)=>{
    if(a.id==='D')return -1; if(b.id==='D')return 1;
    return parseInt(a.id)-parseInt(b.id);
  });
  if(filtreEtat!=='tous') lx=lx.filter(l=>l.etat===filtreEtat);
  if(filtreImpl!=='tous') lx=lx.filter(l=>l.implantation===filtreImpl);
  if(q) lx=lx.filter(l=>l.titre.toLowerCase().includes(q)||(l.implantation||'').toLowerCase().includes(q));
  document.getElementById('lct').textContent=lx.length+' lieu'+(lx.length>1?'x':'');
  document.getElementById('litems').innerHTML=lx.map(l=>`
    <div class="lc" onclick="openF(D.lieux.find(x=>x.id==='${l.id}'),'vl')">
      <div class="lcn" style="background:${mC(l)}">${mL(l)}</div>
      <div class="lcb">
        <div class="lct2">${l.titre}${eb(l.etat)}${l.implantation?`<span class="eb impl">${l.implantation}</span>`:''}</div>
      </div>
    </div>`).join('');
}

    document.getElementById('vwApres').innerHTML  = '<img class="vw-img" id="vwImgApres" src="" alt=""><div class="vw-hint">Cliquer pour agrandir</div>';

    const btnAvant = document.getElementById('tabBtnAvant');

    btnApres.textContent = l.label_apres || 'Après';
    btnAvant.style.display = ''; btnApres.style.display = '';

    // Charger une photo : image directe ou bouton lien externe
    function chargerPhoto(url, imgId, wrapId) {
      const img  = document.getElementById(imgId);
      const wrap = document.getElementById(wrapId);
      if (!url) { wrap.innerHTML = '<div class="vw-hint" style="position:static;padding:1rem;font-size:13px">Non disponible</div>'; return; }
      // Tenter d'afficher comme image — si erreur → bouton externe
      img.src = url;

      img.onerror = () => {
        wrap.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:1rem;padding:1rem;text-align:center;background:var(--grl);border-radius:10px">
            <div style="font-size:13px;color:var(--gr3)">Aperçu non disponible</div>
            <a href="#" onclick="ouvrirExterne('${url}');return false;" class="archive-btn">Voir le document ↗</a>
          </div>`;
      };
    }

    chargerPhoto(l.photo_avant, 'vwImgAvant', 'vwAvant');

// ── MODAL PHOTO + PINCH-TO-ZOOM ───────────────
let pz = { scale:1, tx:0, ty:0, startDist:0, startScale:1,
           dragging:false, lastX:0, lastY:0, lastTap:0 };

function pzApply(img, animate) {
  img.style.transition = animate ? 'transform .2s ease' : 'none';
  img.style.transform  = `translate(${pz.tx}px,${pz.ty}px) scale(${pz.scale})`;
}
function pzReset(img, animate) {
  pz.scale=1; pz.tx=0; pz.ty=0; pzApply(img, animate);
}

function initPinchZoom(img) {
  pzReset(img, false);

  img.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pz.startDist = Math.hypot(dx, dy);
      pz.startScale = pz.scale;
      pz.dragging = false;
    } else if (e.touches.length === 1) {
      pz.dragging = true;
      pz.lastX = e.touches[0].clientX;
      pz.lastY = e.touches[0].clientY;
      // Double tap → reset
      const now = Date.now();
      if (now - pz.lastTap < 300) pzReset(img, true);
      pz.lastTap = now;
    }
  }, { passive: true });

  img.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const dx   = e.touches[0].clientX - e.touches[1].clientX;
      const dy   = e.touches[0].clientY - e.touches[1].clientY;
      pz.scale   = Math.min(5, Math.max(1, pz.startScale * (Math.hypot(dx,dy) / pz.startDist)));
      pzApply(img, false);
    } else if (e.touches.length === 1 && pz.dragging && pz.scale > 1) {
      pz.tx += e.touches[0].clientX - pz.lastX;
      pz.ty += e.touches[0].clientY - pz.lastY;
      pz.lastX = e.touches[0].clientX;
      pz.lastY = e.touches[0].clientY;
      pzApply(img, false);
    }
  }, { passive: false });

  img.addEventListener('touchend', () => { pz.dragging = false; });
}

function agrandir(cote) {
  const src = cote === 'avant'
    ? document.getElementById('vwImgAvant').src
    : document.getElementById('vwImgApres').src;
  if (!src) return;
  const img = document.getElementById('photoModalImg');
  img.src = src;
  document.getElementById('photoModal').classList.add('open');
  const hint = document.getElementById('photoModalHint');
  if(hint){ hint.style.opacity='1'; setTimeout(()=>hint.style.opacity='0', 3000); }
  if (img.complete) initPinchZoom(img);
  else img.onload = () => initPinchZoom(img);
}

// ── MINI-CARTE ─────────────────────────────────
function initMini(l) {
  const c=document.getElementById('fmap');
  Object.values(minimaps).forEach(m=>{try{m.remove();}catch(e){}});
  minimaps={}; c.innerHTML='';
  const m=L.map(c,{center:[l.gps.lat,l.gps.lng],zoom:15,zoomControl:true,scrollWheelZoom:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19}).addTo(m);
  L.marker([l.gps.lat,l.gps.lng],{icon:L.divIcon({className:'',
    html:`<div style="width:28px;height:28px;border-radius:50%;background:${mC(l)};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${mL(l)}</div>`,
    iconSize:[28,28],iconAnchor:[14,14]})}).addTo(m);
  minimaps[l.id]=m;
  setTimeout(()=>m.invalidateSize(),100);
  setTimeout(()=>m.invalidateSize(),500);
}

// ── COULEURS MARQUEURS ─────────────────────────
function mC(l){
  if(l.couleur) return l.couleur;          // couleur Excel en priorité
  if(l.id==='D') return '#2E7D32';          // Départ → vert
  if((l.etat||'').toLowerCase()==='disparu') return '#C62828'; // Disparu → rouge
  return '#1A3A5C';                          // défaut → bleu
}
function mL(l){return l.id==='D'?'D':(parseInt(l.id)||l.id);}

// ── CARTE ──────────────────────────────────────
function setMapHeight(){
  const hdrH=document.querySelector('#vp .hdr').offsetHeight;
  const fnavH=document.getElementById('fnav-global').offsetHeight;
  document.getElementById('map').style.height=(window.innerHeight-hdrH-fnavH)+'px';
}
window.addEventListener('resize',()=>{setMapHeight();if(MAP)MAP.invalidateSize();});

function initMap(){
  setMapHeight();
  if(mapOk){MAP.invalidateSize();return;}
  mapOk=true;
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    MAP=L.map('map',{center:[D.sentier.centre.lat,D.sentier.centre.lng],zoom:D.sentier.zoom_defaut||14,zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://openstreetmap.org">OSM</a>',maxZoom:19}).addTo(MAP);
    fetch('assets/trace.gpx').then(r=>r.ok?r.text():null).then(txt=>{
      if(!txt)return;
      const pts=[...new DOMParser().parseFromString(txt,'text/xml').querySelectorAll('trkpt,rtept')];
      if(!pts.length)return;
      const coords=pts.map(p=>[parseFloat(p.getAttribute('lat')),parseFloat(p.getAttribute('lon'))]);
      const pl=L.polyline(coords,{color:D.sentier.couleur_trace||'#1A3A5C',weight:4,opacity:.75,dashArray:'8 4'}).addTo(MAP);
      MAP.fitBounds(pl.getBounds(),{padding:[40,40]});
    }).catch(()=>{});
    D.lieux.forEach(l=>{
      if(!l.gps||!l.gps.lat)return;
      L.marker([l.gps.lat,l.gps.lng],{icon:L.divIcon({className:'',
        html:`<div style="width:34px;height:34px;border-radius:50%;background:${mC(l)};border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)">${mL(l)}</div>`,
        iconSize:[34,34],iconAnchor:[17,17]})})
        .addTo(MAP)
        .bindPopup(`<div style="font-family:'Segoe UI',sans-serif;min-width:180px">
          <b style="font-size:14px">${l.titre}</b>
          ${l.etat?`<br><small style="color:#999">${l.etat}</small>`:''}
          ${l.implantation?`<br><small style="color:#999">${l.implantation}</small>`:''}
          <br><br>
          <button onclick="openF(D.lieux.find(x=>x.id==='${l.id}'),'vp')"
            style="background:#1A3A5C;color:#fff;border:none;padding:7px 12px;border-radius:6px;font-size:13px;cursor:pointer;width:100%">
            Voir la fiche →</button></div>`,{maxWidth:220})
        .on('click',()=>MAP.setView([l.gps.lat,l.gps.lng],16,{animate:true}));
    });
  });});
}

// ── GPS ────────────────────────────────────────
function gps(){
  if(!('geolocation' in navigator))return;
  document.getElementById('mst').textContent='Localisation…';
  let uM=null;
  navigator.geolocation.watchPosition(p=>{
    const{latitude:la,longitude:lo,accuracy:ac}=p.coords;
    document.getElementById('mst').textContent=`GPS ±${Math.round(ac)}m`;

    // Mettre à jour le marqueur utilisateur sur la carte si disponible
    if(MAP){
      if(!uM)uM=L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div class="udot"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(MAP);
      else uM.setLatLng([la,lo]);
      // Recentrer la carte sur la position
      MAP.setView([la,lo], MAP.getZoom(), {animate:true, duration:0.5});
    }

    D.lieux.forEach(l=>{
      if(!l.gps||!l.gps.lat)return;
      const rayon = l.rayon_declenchement||50;
      const d=hav(la,lo,l.gps.lat,l.gps.lng);

      if(d<=rayon && l.id!==lastN){
        // Entrée dans la zone → déclenchement
        lastN=l.id;
        showN(l,d);
      } else if(d>rayon*3 && l.id===lastN){
        // Sortie de la zone (3x le rayon) → réinitialiser pour permettre un nouveau déclenchement
        lastN=null;
      }
    });
  },()=>document.getElementById('mst').textContent='GPS indisponible',
  {enableHighAccuracy:true,maximumAge:5000,timeout:10000});
}
function jouerSonNotif() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Deux notes courtes : ding-dong
    [[880, 0, 0.3], [660, 0.35, 0.3]].forEach(([freq, start, dur]) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.8, ctx.currentTime + start + 0.01);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    });
  } catch(e) {} // Silencieux si Web Audio non supporté
}

function afficherNotifGPS(l, d) {
  document.getElementById('gpsNotifTitre').textContent = l.titre;
  document.getElementById('gpsNotifDist').textContent  = `À ${Math.round(d)} m — ${l.implantation || l.etat || ''}`;
  document.getElementById('gpsNotifBtn').onclick = () => { fermerNotifGPS(); openF(l, 'vp'); };
  document.getElementById('gpsNotif').classList.add('show');
  jouerSonNotif();
  if(notifTm) clearTimeout(notifTm);
  notifTm = setTimeout(fermerNotifGPS, 30000);
}

function fermerNotifGPS() {
  document.getElementById('gpsNotif').classList.remove('show');
  if(notifTm) { clearTimeout(notifTm); notifTm = null; }
}

function showN(l, d) {
  // Notification dans le parcours (rétrocompat)
  if(document.getElementById('nT')) {
    document.getElementById('nT').textContent = l.titre;
    document.getElementById('nS').textContent = `À ${Math.round(d)}m`;
    document.getElementById('nBtn').onclick = () => openF(l,'vp');
    document.getElementById('notif').classList.add('on');
  }
  // Notification globale sur toutes les vues
  afficherNotifGPS(l, d);
}
function hav(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

init();
